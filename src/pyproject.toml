[tool.poetry]
name = "deps_file_storage"
version = "0.2.0"
description = "DEPS service to storage files (.png, .pdf and etc)"
authors = []

[tool.poetry.dependencies]
python = "~3.12"
docutils = ">=0.21.2"
pydantic = "^2.7"
pydantic-settings = "^2.4"
click = "^8.0.4"
dependency-injector = "^4.48.0"

fastapi = "^0.120"
werkzeug = "^3.1.5"
python-multipart = "^0.0.22"
uvicorn = "^0.15.0"
starlette = "^0.49.1"
requests = "^2.33.0"
urllib3 = "^2.6.0"

python-magic = "0.4.18"
certifi = ">=2023.7.22"
google-cloud-storage = "1.31.2"
google-cloud-core = "1.4.1"
boto3 = "^1.17.23"
blinker = "^1.4"
psycopg2-binary = "^2.9.1"
azure-storage-blob = "^12.9.0"
azure-core = "^1.38.0"
aiofiles = "^23.1.0"
aiohttp = "^3.13.3"
SQLAlchemy = "^2"
Authlib = ">=1.6.11"
asyncer = "^0"
pyasn1 = "^0.6.2"

deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq", "deps-integrations"], develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }
deps-async-datasource = {path = "../vendors/deps-async-datasource/src", develop = true}
protobuf = "^6.32.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.5.1"
bandit = "^1.7.5"
flake8 = "^6.1.0"
wemake-python-styleguide = "^0.18"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
coverage = "^5.5"
factory-boy = "^3.2.0"
pytest-factoryboy = "^2.1.0"
pytest-mock = "^3.6.0"
types-requests = "^2.30"
pytest-flake8 = "^1.2"
pytest-pylint = "^0.20"
pytest-faker = "^2.0.0"
pytest-asyncio = "^0.21.2"
responses = "~=0.10.6"
types-aiofiles = "23.2.0"
httpx = "^0.27.0"

ipdb = "^0.13.13"
see = "^1.4.1"
# setuptools 82+ dropped pkg_resources; flake8-commas 2.x (pulled by wemake-python-styleguide) still imports it for flake8 plugins.
setuptools = ">=70,<82"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.black]
line-length = 130
target-version = ['py312']
exclude = '''
(
    .venv
    | vendors
)
'''
