[tool:pytest]
rootdir = .
cache_dir = /tmp/test_cache/.pytest_cache

filterwarnings =
    ignore::UserWarning
    ignore::FutureWarning
    ignore::DeprecationWarning

[flake8]
ignore=
    # Class without a base class
    WPS306,
    # Found `f` string
    WPS305
    # Remove all docstring rules
    D,
    # Remove bad quotes
    Q000,
    # Found empty comment
    WPS464,
    # Found local folder import
    WPS300,
    # Found `__init__.py` module with logic
    WPS412,
    # Found `else` in a loop without `break`
    WPS500,
    # Found too short name: x
    WPS111,
    # Found function with too much cognitive complexity NEED TO GOOGLE AND SET COGNITIVE
    WPS231,
    # Found incorrectly nested ternary
    WPS509,
    # Found too many imported names from a module
    WPS235,
    # Found string constant over-use
    WPS226,
    # Found a line that starts with a dot
    WPS348,
    # Found multiline conditions
    WPS337,
    # Found module with too many imports
    WPS201,
    # Found using `@staticmethod`
    WPS602,
    # Requests call with verify=False disabling SSL certificate checks, security issue
    S501,
    # Found too long ``try`` body length
    WPS229,
    # line break before binary operator
    W503,
    # Found a too complex `f` string
    WPS237,
    # Found a getter without a return value
    WPS463,
    # Found subclassing a builtin
    WPS600,
    # Do not perform function calls in argument defaults
    B008,
    # Found too many arguments
    WPS211,
    # Found complex default value
    WPS404,
    # Found too many expressions
    WPS213,
    # Found upper-case constant in a class
    WPS115,
    # Found overused expression
    WPS204,
    # Possible binding to all interfaces
    S104,
    # Found reversed complex comparison
    WPS334,
    # Found too long name
    WPS118,
    # Found inconsistent `return` statement
    WPS324,
    # Found executable mismatch
    WPS453,
    # Found nested class: Config
    WPS431,
    # Found string formatting
    WPS323,
    # Found wrong metadata variable: __all__
    WPS410,
    # Found vague import that may cause confusion: *
    WPS347,
    # Found block variables overlap: *
    WPS440,
    # Found direct magic attribute usage: __all__
    WPS609,
    # '*' used; unable to detect undefined names
    F403,
    # defined from star imports
    F405,
    # exception name should be named with an Error suffix
    N818,
    WPS473,

allowed-domain-names =
    value,  # We allow using 'value' name when creating dictionaries
    values, # pydantic validator
    file,   # We are working with files
    data,   # We use name 'data' in our models
    info,    # We use it in settings
    content

per-file-ignores =
  # There are multiple `assert`s in tests, we allow them:
  */__init__.py: F401, WPS412, WPS410
  */interfaces.py: WPS420
  */async_interfaces/*: WPS420
  */query_factories.py: S608, WPS326
  */__main__.py: WPS420
  */exceptions.py: WPS604, WPS420
  */app.py: WPS433, WPS430
  */error_handlers.py: WPS430
  ./deps_file_storage/extras/*: S105, WPS420, WPS604, WPS112, WPS615, WPS110, WPS430, WPS220, WPS331, WPS516, WPS437, WPS601, WPS326, WPS503, WPS338, WPS214, WPS608, P101, WPS433, WPS232, S113, B019, WPS425, N805


max-local-variables = 15
max-methods = 17
max-line-length = 130
max-module-members = 10
max-line-complexity = 20

exclude =
    .git,
    __pycache__,
    tests,
    vendors,
    .venv

# to disable false positive N805
classmethod-decorators =
    classmethod
    validator
    root_validator

[mypy]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False
disable_error_code = attr-defined, name-defined

[mypy-tests.*]
ignore_errors = True

[isort]
profile = black
multi_line_output = 3
skip =
    vendors
    .venv

[coverage:run]
omit =
    tests/*
    */__init__.py
    /vendors/*
    /app/.venv/*
branch = True
data_file=/tmp/test_cache/.coverage

[ipdb]
context = 21
