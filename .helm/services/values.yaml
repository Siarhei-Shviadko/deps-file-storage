# Default values for deps-file-storage.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# kubectl create secret generic file-storage-database --from-literal=user="<file_storage-db_user>" --from-literal=password="<file_storage_db_user_password>"
# kubectl create secret generic file-storage-aws-credentials --from-literal=aws-access-key-id="<aws-access-key-id>" --from-literal=aws-secret-access-key="<aws-secret-access-key>"
# kubectl create secret generic keycloak-certs-endpoint --from-literal=keycloak-certs-endpoint='<https://KEYCLOAK_URL/auth/realms/Test/protocol/openid-connect/certs>'
# kubectl create secret generic database-host --from-literal=database-host='<DATABASE_HOST>'

secrets:
  deps_file_storage:
    secretName: deps-file-storage
  deps_file_storage_secret:
    secretName: deps-file-storage-secret
  telemetry_secrets:
    secretName: telemetry-secrets

registry: ""
env: ""

helm_logs_job:
  image:
    path: '/base/kubernetes-helm'
    pullPolicy: IfNotPresent
    tag: "0.1.1"
  serviceAccountName: gitlab-ci
  resources: {}

migrator_update:
  image:
    path: '/deps-dev-x01/deps-file-storage-migrator'
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets: artifactory
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
  #   cpu: 100m
  #   memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

file_storage:
  replicaCount: 1
  image:
    path: '/deps-dev-x01/deps-file-storage'
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets: 'artifactory'
  podAnnotations: {}
  service:
    type: "ClusterIP"
    port: 8004
    portname: 'fs-svc-prt'
    protocol: TCP
  container:
    port: 8004
    portname: 'fs-cnt-prt'
    protocol: TCP
  resources: {}
  #   limits:
  #     cpu: 300m
  #     memory: 1100Mi
  #   requests:
  #     cpu: 200m
  #     memory: 350Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  INSTALL_DEV_DEPENDENCIES: 'true'
  volume:
    enabled: true
    capacity: '6Gi'
    storage_class_name: 'nfs-client'
    accessModes: 'ReadWriteOnce'

file_storage_consumer:
  replicaCount: 1
  image:
    path: '/deps-dev-x01/deps-file-storage'
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets: 'artifactory'
  podAnnotations: {}
  resources: {}
  #    limits:
  #      cpu: 300m
  #      memory: 1100Mi
  #    requests:
  #      cpu: 200m
  #      memory: 350Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  volume:
    enabled: true
    storage_class_name: 'nfs-client'

file_storage_nginx:
  replicaCount: 1
  image:
    path: '/deps-dev-x01/deps-file-storage-nginx'
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets: 'artifactory'
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 8000
    portname: 'fsn-svc-prt'
    protocol: TCP
  container:
    port: 8000
    portname: 'fsn-cnt-prt'
    protocol: TCP
  resources: {}
  #    limits:
  #      cpu: 100m
  #      memory: 100Mi
  #    requests:
  #      cpu: 80m
  #      memory: 50Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

certs_location:
  certs_default_path: "/tmp/ssl"

  database_sslcerts_path: "/home/dbcerts"

file_storage_settings:
  ENV: dev
  DEFAULT_STORAGE: FILE_STORAGE
  MEDIA_ROOT: '/media/files'

  # add gcp variables in order to use GCP storage
  GCP_BLOB_STORAGE_BUCKET_NAME: ''
  GCP_BLOB_STORAGE_AUTH_KEY: ''
  MEDIA_EXPIRES: '60'

  DATABASE_PORT: 5432
  DATABASE_REQUIRE_SECURE_TRANSPORT: false
  DATABASE_SSLKEY_PATH: "/home/dbcerts/tls.key"
  DATABASE_SSLCERT_PATH: "/home/dbcerts/tls.crt"
  DATABASE_SSLROOTCERT_PATH: "/home/dbcerts/root.crt"

  DATABASE_DIALECT: 'postgresql'
  DATABASE_DRIVER: 'psycopg2'

  AUTH_VERIFY_SSL: false

  ADMINS_GROUP: deps-admins

  S3_ENDPOINT_URL: ''
  S3_BUCKET_NAME: ''

  FILE_STORAGE_LOGGER_LEVEL: 'INFO'
  ACCEPTABLE_MIMETYPES: |
    image/jpeg
    image/png
    image/tiff
    application/csv
    application/pdf
    application/json
    application/octet-stream
    application/vnd.ms-outlook
    message/rfc822
    text/plain
    text/html
    text/csv
    application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    application/vnd.ms-excel
    application/vnd.openxmlformats-officedocument.wordprocessingml.document
    application/msword

  DOCUMENTATION_ENABLED: "true"

  RABBITMQ_TLS_ENABLED: false
  RABBITMQ_TLS_DLX_PER_QUEUE: false
  RABBITMQ_DLX_PER_QUEUE: false

  KAFKA_GROUP_ID: file-storage
  KAFKA_SECURITY_ENABLED: false

  # Azure Service Bus
  ASB_SUBSCRIPTION_STRATEGY: 'no_preparation'
  ASB_TOPIC_NAME: 'deps-topic'
  message_broker_asb_without_manage_permission: false

  # Telemetry
  INSTRUMENTATION_ENABLED: false
  SERVICE_NAME: deps-file-storage
  EXPORTER_TYPE: azure

migration_settings:
  DATABASE_PORT: '5432'

# The service account is necessary to obtain secrets from HashiCorp Vault
serviceAccount:
  name: deps-develop

helm:
  helm_logs_job_enabled: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

csi:
  csi_default_name: deps-file-storage
  vault_namespace: 'k8s-dev'
  roleName: 'k8s-dev'
  vaultKubernetesMountPath: 'kubernetes-dev'

secrets_location:
  secrets_default_path: "/mnt/secrets-store"

service_account:
  serviceAccountName: 'deps-develop'

secret_project_id:
  id: ""

azure_kv_settings:
  keyvaultName: ""
  tenantId: ""
  userAssignedIdentityID: ""
  resourceGroup: ""
  subscriptionId: ""

