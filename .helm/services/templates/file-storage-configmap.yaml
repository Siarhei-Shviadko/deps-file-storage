apiVersion: v1
kind: ConfigMap
metadata:
  name: file-storage-configmap
data:
  ENV: {{ .Values.file_storage_settings.ENV }}
  DEFAULT_STORAGE: {{ .Values.file_storage_settings.DEFAULT_STORAGE | quote }}
  MEDIA_ROOT: {{ .Values.file_storage_settings.MEDIA_ROOT | quote }}
  GCP_BLOB_STORAGE_BUCKET_NAME: {{ .Values.file_storage_settings.GCP_BLOB_STORAGE_BUCKET_NAME | quote }}
  MEDIA_EXPIRES: {{ .Values.file_storage_settings.MEDIA_EXPIRES | quote }}

  DATABASE_PORT: {{ .Values.file_storage_settings.DATABASE_PORT | quote }}
  DATABASE_REQUIRE_SECURE_TRANSPORT: '{{ .Values.file_storage_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}'
  {{ if .Values.file_storage_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
  DATABASE_SSLKEY: {{ .Values.file_storage_settings.DATABASE_SSLKEY_PATH }}
  DATABASE_SSLCERT: {{ .Values.file_storage_settings.DATABASE_SSLCERT_PATH }}
  DATABASE_SSLROOTCERT: {{ .Values.file_storage_settings.DATABASE_SSLROOTCERT_PATH }}
  {{ end }}


  DATABASE_DIALECT: {{ .Values.file_storage_settings.DATABASE_DIALECT | quote }}
  DATABASE_DRIVER: {{ .Values.file_storage_settings.DATABASE_DRIVER | quote }}

  AUTH_VERIFY_SSL: {{ .Values.file_storage_settings.AUTH_VERIFY_SSL | quote }}
  ADMINS_GROUP: {{ .Values.file_storage_settings.ADMINS_GROUP | quote }}

  S3_ENDPOINT_URL: {{ .Values.file_storage_settings.S3_ENDPOINT_URL | quote }}
  S3_BUCKET_NAME: {{ .Values.file_storage_settings.S3_BUCKET_NAME | quote }}

  FILE_STORAGE_LOGGER_LEVEL: {{ .Values.file_storage_settings.FILE_STORAGE_LOGGER_LEVEL | quote }}
  ACCEPTABLE_MIMETYPES: {{ .Values.file_storage_settings.ACCEPTABLE_MIMETYPES | toJson | quote }}

  DOCUMENTATION_ENABLED: {{ .Values.file_storage_settings.DOCUMENTATION_ENABLED | quote }}
  KAFKA_GROUP_ID: {{ .Values.file_storage_settings.KAFKA_GROUP_ID | quote }}
  RABBITMQ_TLS_DLX_PER_QUEUE: '{{ .Values.file_storage_settings.RABBITMQ_TLS_DLX_PER_QUEUE }}'
  RABBITMQ_DLX_PER_QUEUE: '{{ .Values.file_storage_settings.RABBITMQ_DLX_PER_QUEUE }}'
  {{ if .Values.file_storage_settings.RABBITMQ_TLS_ENABLED }}
  RABBITMQ_TLS_HOST: '{{ .Values.file_storage_settings.RABBITMQ_TLS_HOST }}'
  RABBITMQ_TLS_PORT: '{{ .Values.file_storage_settings.RABBITMQ_TLS_PORT }}'
  RABBITMQ_TLS_USER: '{{ .Values.file_storage_settings.RABBITMQ_TLS_USER }}'
  RABBITMQ_TLS_VHOST: '{{ .Values.file_storage_settings.RABBITMQ_TLS_VHOST }}'
  RABBITMQ_TLS_SUBJECT: '{{ .Values.file_storage_settings.RABBITMQ_TLS_SUBJECT }}'
  RABBITMQ_TLS_CA_CERT: '{{ .Values.file_storage_settings.RABBITMQ_TLS_CA_CERT }}'
  RABBITMQ_TLS_CLIENT_CERT: '{{ .Values.file_storage_settings.RABBITMQ_TLS_CLIENT_CERT }}'
  RABBITMQ_TLS_CLIENT_KEY: '{{ .Values.file_storage_settings.RABBITMQ_TLS_CLIENT_KEY }}'
  {{ end }}
  {{ if .Values.file_storage_settings.KAFKA_SECURITY_ENABLED }}
  KAFKA_SASL_MECHANISM: '{{ .Values.file_storage_settings.KAFKA_SASL_MECHANISM }}'
  KAFKA_SECURITY_PROTOCOL: '{{ .Values.file_storage_settings.KAFKA_SECURITY_PROTOCOL }}'
  {{ end }}
  {{ if .Values.file_storage_settings.message_broker_asb_without_manage_permission }}
  ASB_SUBSCRIPTION_STRATEGY: '{{ .Values.file_storage_settings.ASB_SUBSCRIPTION_STRATEGY }}'
  {{ end }}
  ASB_TOPIC_NAME: '{{ .Values.file_storage_settings.ASB_TOPIC_NAME }}'

  # Telemetry
  INSTRUMENTATION_ENABLED: '{{ .Values.file_storage_settings.INSTRUMENTATION_ENABLED }}'
  SERVICE_NAME: '{{ .Values.file_storage_settings.SERVICE_NAME }}'
  EXPORTER_TYPE: '{{ .Values.file_storage_settings.EXPORTER_TYPE }}'
