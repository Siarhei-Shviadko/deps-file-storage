{{- if .Values.file_storage.volume.enabled }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: file-storage-volume-claim
spec:
  storageClassName: {{ .Values.file_storage.volume.storage_class_name }}
  accessModes:
    - {{ .Values.file_storage.volume.accessModes }}
  resources:
    requests:
      storage: {{ .Values.file_storage.volume.capacity }}
{{- end }}
