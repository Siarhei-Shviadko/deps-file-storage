apiVersion: apps/v1
kind: Deployment
metadata:
  name: deps-file-storage-consumer
  labels:
    {{- include "deps-file-storage.labels" . | nindent 4 }}
    app.kubernetes.io/component: deps-file-storage-consumer
spec:
  replicas: {{ .Values.file_storage_consumer.replicaCount }}
  selector:
    matchLabels:
      {{- include "deps-file-storage.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: deps-file-storage-consumer
  template:
    metadata:
      {{- if or .Values.file_storage_consumer.podAnnotations .Values.inject_secrets.enabled }}
      annotations:
        {{- include "deps-file-storage.vaultAnnotations" . | nindent 8 }}
        app.kubernetes.io/component: deps-file-storage-consumer
      {{- with .Values.file_storage_consumer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      labels:
        {{- include "deps-file-storage.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: deps-file-storage-consumer
    spec:
      {{- if .Values.file_storage_consumer.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.file_storage_consumer.imagePullSecrets }}
      {{- end }}
      {{- if .Values.service_account.serviceAccountName }}
      serviceAccountName: {{ .Values.service_account.serviceAccountName }}
      {{- end }}
      {{ if .Values.file_storage_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
      initContainers:
      - name: init-{{ .Chart.Name }}
        image: busybox
        command: ["sh", "-c", "cp /home/inputdbcerts/* /home/outputdbcerts/ && chmod g-r /home/outputdbcerts/*.key"]
        volumeMounts:
          - name: tls-database-certs
            mountPath: /home/inputdbcerts
          - name: outputdbcerts
            mountPath: /home/outputdbcerts
      {{ end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.registry }}{{ .Values.file_storage_consumer.image.path }}:{{ .Values.file_storage_consumer.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.file_storage_consumer.image.pullPolicy }}
          command: ["python", "-m", "deps_file_storage", "consume"]
          env:
          {{ if .Values.file_storage_settings.INSTRUMENTATION_ENABLED }}
            {{ if eq .Values.file_storage_settings.EXPORTER_TYPE "azure" }}
          - name: APPLICATION_INSIGHTS_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets.telemetry_secrets.secretName }}
                key: application-insights-connection-string
            {{ end }}
          {{ end }}
          - name: "INSTALL_DEV_DEPENDENCIES"
            value: {{ .Values.file_storage.INSTALL_DEV_DEPENDENCIES | quote }}
          {{- if .Values.vault_settings.enabled }}
          {{- toYaml .Values.file_storage_consumer_vault_enabled.env | nindent 10 }}
          {{ if .Values.file_storage_settings.RABBITMQ_TLS_ENABLED }}
          - name: RABBITMQ_TLS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: deps-file-storage
                key: rabbitmq-password
          {{ end }}
          {{ if .Values.file_storage_settings.KAFKA_SECURITY_ENABLED }}
          - name: KAFKA_SASL_USERNAME
            valueFrom:
              secretKeyRef:
                name: deps-file-storage
                key: kafka-sasl-username
          - name: KAFKA_SASL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: deps-file-storage
                key: kafka-sasl-password
          {{ end }}
          {{- else }}
          {{- toYaml .Values.file_storage_consumer_vault_disabled.env | nindent 10 }}
          {{ if .Values.file_storage_settings.RABBITMQ_TLS_ENABLED }}
          - name: RABBITMQ_TLS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rabbitmq-password
                key: rabbitmq-password
          {{ end }}
          {{ if .Values.file_storage_settings.KAFKA_SECURITY_ENABLED }}
          - name: KAFKA_SASL_USERNAME
            valueFrom:
              secretKeyRef:
                name: kafka-secrets
                key: kafka-sasl-username
          - name: KAFKA_SASL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kafka-secrets
                key: kafka-sasl-password
          {{ end }}
          {{- end }}
          envFrom:
          - configMapRef:
              name: file-storage-configmap
              optional: false
          readinessProbe:
            exec:
              command:
                - "bash"
                - "-c"
                - |
                  echo > /dev/tcp/$DATABASE_HOST/$DATABASE_PORT && echo "PostgreSQL connected" || { echo "PostgreSQL not connected"; exit 1; }

                  if [ "$MESSAGING_DRIVER" == "rabbitmq" ]; then
                    echo > /dev/tcp/$MESSAGING_DRIVER/5672 && echo "RabbitMQ connected" || { echo "RabbitMQ not connected"; exit 1; }
                  fi

                  if [ "$MESSAGING_DRIVER" == "kafka" ]; then
                    echo > /dev/tcp/$(echo "$MESSAGE_BROKER_CONNECTION_STRING" | cut -d':' -f1)/$(echo "$MESSAGE_BROKER_CONNECTION_STRING" | cut -d':' -f2) && echo "Kafka connected" || { echo "Kafka not connected"; exit 1; }
                  fi
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 14
          resources:
            {{- toYaml .Values.file_storage_consumer.resources | nindent 12 }}
          volumeMounts:
          {{- if .Values.file_storage_consumer.volume.enabled }}
          - mountPath: /media/files
            name: file-storage-volume
          {{- end }}
          {{ if .Values.file_storage_settings.RABBITMQ_TLS_ENABLED }}
          - name: security-certs
            mountPath: {{ .Values.certs_location.certs_default_path }}
            readOnly: true
          {{ end }}
          {{- if .Values.vault_settings.enabled }}
          - name: secrets-store-inline
            mountPath: {{ .Values.secrets_location.secrets_default_path }}
            readOnly: true
          {{ end }}
          {{ if .Values.file_storage_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
          - name: outputdbcerts
            mountPath: {{ .Values.certs_location.database_sslcerts_path }}
          {{ end }}
      volumes:
      {{- if .Values.file_storage_consumer.volume.enabled }}
        - name: file-storage-volume
          persistentVolumeClaim:
            claimName: file-storage-volume-claim
      {{- end }}
      {{ if .Values.file_storage_settings.RABBITMQ_TLS_ENABLED }}
        - name: security-certs
          secret:
            secretName: {{ .Values.secrets.security_certs.secretName }}
      {{- end }}
      {{- if .Values.vault_settings.enabled }}
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.csi.csi_default_name }}
      {{- end }}
      {{ if .Values.file_storage_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
        - name: tls-database-certs
          secret:
            secretName: database-ssl-secret
            items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
              mode: 0600
            - key: root.crt
              path: root.crt
            defaultMode: 0644
        - name: outputdbcerts
          emptyDir: {}
      {{ end }}
      {{- with .Values.file_storage_consumer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.file_storage_consumer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.file_storage_consumer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
