{{- if .Values.vault_settings.gcp_secret_manager }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/keycloak-certs-endpoint/versions/latest" 
        fileName: "keycloak-certs-endpoint"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/auth-enabled/versions/latest" 
        fileName: "auth-enabled"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/access-mode/versions/latest" 
        fileName: "access-mode"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/message-broker-driver/versions/latest" 
        fileName: "message-broker-driver"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-message-broker-connection-string/versions/latest" 
        fileName: "message-broker-connection-string"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-aws-access-key-id/versions/latest" 
        fileName: "aws-access-key-id"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-aws-secret-access-key/versions/latest" 
        fileName: "aws-secret-access-key"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-azure-connection-string/versions/latest" 
        fileName: "azure-connection-string"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-azure-container-name/versions/latest" 
        fileName: "azure-container-name"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-database-host/versions/latest" 
        fileName: "db-host"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-file-storage-db-user/versions/latest" 
        fileName: "file-storage-db-user"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-file-storage-db-password/versions/latest" 
        fileName: "file-storage-db-password"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-file-storage-db/versions/latest" 
        fileName: "file-storage-db"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/cipher-key/versions/latest" 
        fileName: "cipher-key"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-gcp-api-key/versions/latest" 
        fileName: "gcp-api-key"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/files-deletion-enabled/versions/latest" 
        fileName: "files-deletion-enabled"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/async-file-storage/versions/latest" 
        fileName: "async-file-storage"
  secretObjects:
    - secretName: {{ .Values.secrets.deps_file_storage.secretName }}
      type: Opaque
      data:
      - objectName: "async-file-storage"
        key: async-file-storage
      - objectName: "files-deletion-enabled"
        key: files-deletion-enabled
      - objectName: "gcp-api-key"
        key: gcp-api-key
      - objectName: "cipher-key"
        key: cipher-key
      - objectName: "db-host"
        key: db-host
      - objectName: "file-storage-db-user"
        key: file-storage-db-user
      - objectName: "file-storage-db-password"
        key: file-storage-db-password
      - objectName: "file-storage-db"
        key: file-storage-db
      - objectName: "azure-container-name"
        key: azure-container-name
      - objectName: "azure-connection-string"
        key: azure-connection-string
      - objectName: "aws-secret-access-key"
        key: aws-secret-access-key
      - objectName: "aws-access-key-id"
        key: aws-access-key-id
      - objectName: "message-broker-connection-string"
        key: message-broker-connection-string
      - objectName: "message-broker-driver"
        key: message-broker-driver
      - objectName: "access-mode"
        key: access-mode
      - objectName: "auth-enabled"
        key: auth-enabled
      - objectName: "keycloak-certs-endpoint"
        key: keycloak-certs-endpoint
{{- end }}
