{{- if .Values.vault_settings.aws_secret_manager }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "3"
spec:
  provider: aws
  parameters:
    region: {{ .Values.vault_settings.aws_secret_manager_region }}
    objects: |
      - objectName: "file-storage-db-user"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "file-storage-db-password"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "db-host"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "file-storage-db"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "aws-access-key-id"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "aws-secret-access-key"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "keycloak-certs-endpoint"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "message-broker-driver"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "message-broker-connection-string"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "cipher-key"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "azure-connection-string"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "azure-container-name"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "rabbitmq-password"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "kafka-sasl-username"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "kafka-sasl-password"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "access-mode"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "auth-enabled"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "gcp-api-key"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "gcp-location"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "gcp-processor-id"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "gcp-project-id"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "async-file-storage"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
      - objectName: "files-deletion-enabled"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
  secretObjects:
    - secretName: {{ .Values.secrets.deps_file_storage.secretName }}
      type: Opaque
      data:
        - objectName: "file-storage-db-user"
          key: file-storage-db-user
        - objectName: "file-storage-db-password"
          key: file-storage-db-password
        - objectName: "db-host"
          key: db-host
        - objectName: "file-storage-db"
          key: file-storage-db
        - objectName: "async-file-storage"
          key: async-file-storage
        - objectName: "gcp-api-key"
          key: gcp-api-key
        - objectName: "gcp-location"
          key: gcp-location
        - objectName: "gcp-processor-id"
          key: gcp-processor-id
        - objectName: "gcp-project-id"
          key: gcp-project-id
        - objectName: "aws-access-key-id"
          key: aws-access-key-id
        - objectName: "aws-secret-access-key"
          key: aws-secret-access-key
        - objectName: "keycloak-certs-endpoint"
          key: keycloak-certs-endpoint
        - objectName: "message-broker-driver"
          key: message-broker-driver
        - objectName: "message-broker-connection-string"
          key: message-broker-connection-string
        - objectName: "cipher-key"
          key: cipher-key
        - objectName: "azure-connection-string"
          key: azure-connection-string
        - objectName: "azure-container-name"
          key: azure-container-name
        - objectName: "rabbitmq-password"
          key: rabbitmq-password
        - objectName: "kafka-sasl-username"
          key: kafka-sasl-username
        - objectName: "kafka-sasl-password"
          key: kafka-sasl-password
        - objectName: "access-mode"
          key: access-mode
        - objectName: "auth-enabled"
          key: auth-enabled
        - objectName: "files-deletion-enabled"
          key: files-deletion-enabled
{{- end }}