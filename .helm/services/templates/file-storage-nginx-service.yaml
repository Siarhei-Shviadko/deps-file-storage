apiVersion: v1
kind: Service
metadata:
  name: file-storage-nginx
  labels:
    {{- include "deps-file-storage.labels" . | nindent 4 }}
    app.kubernetes.io/component: file-storage-nginx
spec:
  type: {{ .Values.file_storage_nginx.service.type }}
  ports:
    - port: {{ .Values.file_storage_nginx.service.port }}
      targetPort: {{ .Values.file_storage_nginx.container.portname }}
      protocol: {{ .Values.file_storage_nginx.service.protocol }}
      name: {{ .Values.file_storage_nginx.service.portname }}
  selector:
    {{- include "deps-file-storage.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: file-storage-nginx
