{{- if .Values.vault_settings.hashicorp_vault }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
spec:
  provider: vault
  secretObjects:
  - data:
    - key: user
      objectName: user
    - key: password
      objectName: password
    - key: database-db
      objectName: database-db
    - key: aws-access-key-id
      objectName: aws-access-key-id
    - key: aws-secret-access-key
      objectName: aws-secret-access-key
    - key: database-host
      objectName: database-host
    - key: keycloak-certs-endpoint
      objectName: keycloak-certs-endpoint
    - key: message-broker-driver
      objectName: message-broker-driver
    - key: message-broker-connection-string
      objectName: message-broker-connection-string
    - key: cipher-key
      objectName: cipher-key
    - key: azure-connection-string
      objectName: azure-connection-string
    - key: azure-container-name
      objectName: azure-container-name
    - key: rabbitmq-password
      objectName: rabbitmq-password
    - key: kafka-sasl-username
      objectName: kafka-sasl-username
    - key: kafka-sasl-password
      objectName: kafka-sasl-password
    - key: access-mode
      objectName: access-mode
    - key: auth-enabled
      objectName: auth-enabled
    - key: gcp-api-key
      objectName: gcp-api-key
    - key: gcp-location
      objectName: gcp-location
    - key: gcp-processor-id
      objectName: gcp-processor-id
    - key: gcp-project-id
      objectName: gcp-project-id
    - key: async-file-storage
      objectName: async-file-storage
    secretName: {{ .Values.secrets.deps_file_storage.secretName }}
    type: Opaque
  parameters:
    roleName: {{ .Values.csi.roleName }}
    vaultAddress: "https://vault_host"
    vaultNamespace: "vault_namespace"
    vaultSkipTLSVerify: "true"
    #vaultCACertPath: ""
    vaultKubernetesMountPath: {{ .Values.csi.vaultKubernetesMountPath }}
    objects: |
      - objectName: "async-file-storage"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/feature-flags"
        secretKey: "async-file-storage"

      - objectName: "gcp-api-key"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/gcp-credentials"
        secretKey: "gcp-api-key"

      - objectName: "gcp-location"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/gcp-credentials"
        secretKey: "gcp-location"

      - objectName: "gcp-processor-id"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/gcp-credentials"
        secretKey: "gcp-processor-id"

      - objectName: "gcp-project-id"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/gcp-credentials"
        secretKey: "gcp-project-id"

      - objectName: "user"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/file-storage-database"
        secretKey: "user"

      - objectName: "password"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/file-storage-database"
        secretKey: "password"

      - objectName: "database-db"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/file-storage-database"
        secretKey: "database-db"

      - objectName: "aws-access-key-id"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/file-storage-aws-credentials"
        secretKey: "aws-access-key-id"

      - objectName: "aws-secret-access-key"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/file-storage-aws-credentials"
        secretKey: "aws-secret-access-key"

      - objectName: "database-host"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "database-host"

      - objectName: "keycloak-certs-endpoint"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "keycloak-certs-endpoint"

      - objectName: "message-broker-driver"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "message-broker-driver"

      - objectName: "message-broker-connection-string"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "message-broker-connection-string"

      - objectName: "cipher-key"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/cipher-key"
        secretKey: "cipher-key"

      - objectName: "azure-connection-string"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/azure-blob-storage"
        secretKey: "azure-connection-string"

      - objectName: "azure-container-name"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/azure-blob-storage"
        secretKey: "azure-container-name"

      - objectName: "rabbitmq-password"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/rabbitmq-password"
        secretKey: "rabbitmq-password"

      - objectName: "kafka-sasl-username"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/kafka-secrets"
        secretKey: "kafka-sasl-username"

      - objectName: "kafka-sasl-password"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-file-storage/kafka-secrets"
        secretKey: "kafka-sasl-password"

      - objectName: "access-mode"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "access-mode"

      - objectName: "auth-enabled"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "auth-enabled"
{{- end }}
