apiVersion: v1
kind: Service
metadata:
  name: file-storage
  labels:
    {{- include "deps-file-storage.labels" . | nindent 4 }}
spec:
  type: {{ .Values.file_storage.service.type }}
  ports:
  - port: {{ .Values.file_storage.container.port }}
    targetPort: {{ .Values.file_storage.container.portname }}
    protocol: {{ .Values.file_storage.service.protocol }}
    name: {{ .Values.file_storage.service.portname }}
  selector:
    {{- include "deps-file-storage.selectorLabels" . | nindent 4 }}
