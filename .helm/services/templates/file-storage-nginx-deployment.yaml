apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-storage-nginx
  labels:
    {{- include "deps-file-storage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.file_storage_nginx.replicaCount }}
  selector:
    matchLabels:
      {{- include "deps-file-storage.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: file-storage-nginx
  template:
    metadata:
      {{- with .Values.file_storage_nginx.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "deps-file-storage.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: file-storage-nginx
    spec:
      {{- if .Values.file_storage_nginx.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.file_storage_nginx.imagePullSecrets }}
      {{- end }}
      {{- if .Values.podSecurityContext.runAsNonRoot }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-nginx
          image: "{{ .Values.registry }}{{ .Values.file_storage_nginx.image.path }}:{{ .Values.file_storage_nginx.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.file_storage_nginx.image.pullPolicy }}
          ports:
            - name: {{ .Values.file_storage_nginx.container.portname }}
              containerPort: {{ .Values.file_storage_nginx.container.port }}
              protocol: {{ .Values.file_storage_nginx.container.protocol }}
          resources:
            {{- toYaml .Values.file_storage_nginx.resources | nindent 12 }}
      {{- with .Values.file_storage_nginx.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.file_storage_nginx.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.file_storage_nginx.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
