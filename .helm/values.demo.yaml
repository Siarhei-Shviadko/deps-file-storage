file_storage:
  image:
    path: '/deps-platform/deps-file-storage'
  resources: {}
  volume:
    enabled: false

file_storage_consumer:
  image:
    path: '/deps-platform/deps-file-storage'
  resources: {}
  volume:
    enabled: false

file_storage_nginx:
  image:
    path: '/deps-platform/deps-file-storage-nginx'
  resources: {}

migrator_update:
  image:
    path: '/deps-platform/deps-file-storage-migrator'

file_storage_settings:
  ENV: demo
  DATABASE_REQUIRE_SECURE_TRANSPORT: false
  DEFAULT_STORAGE: S3_STORAGE
  S3_BUCKET_NAME: bucket_name
  S3_ENDPOINT_URL: https://s3.us-east-1.amazonaws.com

  FILE_STORAGE_LOGGER_LEVEL: 'INFO'

migration_settings:
  DATABASE_USER: file_storage_demo
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

serviceAccount:
  name: deps-demo

helm:
  helm_logs_job_enabled: false

csi:
  vault_namespace: 'k8s-demo'
  roleName: 'k8s-demo'
  vaultKubernetesMountPath: 'kubernetes-demo'

service_account:
  serviceAccountName: 'deps-demo'
