migrator_update:
  image:
    path: "/deps-platform/deps-file-storage-migrator"

file_storage_settings:
  ENV: qa
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

  FILE_STORAGE_LOGGER_LEVEL: "INFO"

  # Telemetry
  INSTRUMENTATION_ENABLED: true

migration_settings:
  DATABASE_USER: depsqa
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

# The service account is necessary to obtain secrets from HashiCorp Vault
serviceAccount:
  name: deps-qa

# ATTENTION: Remove inject_secrets section to use the Helm chart outside the EPAM network
inject_secrets:
  enabled: false
  mountSecrets:
  - name: DATABASE_USER
    value: "vault:k8s-qa/data/file-storage-database#user"
  - name: DATABASE_PASSWORD
    value: "vault:k8s-qa/data/file-storage-database#password"
  - name: AUTH_CERTS_ENDPOINT
    value: "vault:k8s-qa/data/keycloak-certs-endpoint#keycloak-certs-endpoint"
  - name: DATABASE_HOST
    value: "vault:k8s-qa/data/database-host#database-host"
  - name: AWS_ACCESS_KEY_ID
    value: "vault:k8s-qa/data/file-storage-aws-credentials#aws-access-key-id"
  - name: AWS_SECRET_ACCESS_KEY
    value: "vault:k8s-qa/data/file-storage-aws-credentials#aws-secret-access-key"

helm:
  helm_logs_job_enabled: false

csi:
  vault_namespace: 'k8s-qa'
  roleName: 'k8s-qa'
  vaultKubernetesMountPath: 'kubernetes-qa'

service_account:
  serviceAccountName: 'deps-qa'
