file_storage:
  image:
    path: "/deps-platform/deps-file-storage"
  resources: {}

file_storage_consumer:
  image:
    path: "/deps-platform/deps-file-storage"
  resources: {}

file_storage_nginx:
  image:
    path: "/deps-platform/deps-file-storage-nginx"
  resources: {}

migrator_update:
  image:
    path: "/deps-platform/deps-file-storage-migrator"

file_storage_settings:
  ENV: ds
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

  FILE_STORAGE_LOGGER_LEVEL: "INFO"

migration_settings:
  DATABASE_USER: deps-ds
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

# The service account is necessary to obtain secrets from HashiCorp Vault
serviceAccount:
  name: deps-ds

# ATTENTION: Remove inject_secrets section to use the Helm chart outside the EPAM network
inject_secrets:
  enabled: false
  mountSecrets:
  - name: DATABASE_USER
    value: "vault:k8s-ds/data/file-storage-database#user"
  - name: DATABASE_PASSWORD
    value: "vault:k8s-ds/data/file-storage-database#password"
  - name: AUTH_CERTS_ENDPOINT
    value: "vault:k8s-ds/data/keycloak-certs-endpoint#keycloak-certs-endpoint"
  - name: DATABASE_HOST
    value: "vault:k8s-ds/data/database-host#database-host"
  - name: AWS_ACCESS_KEY_ID
    value: "vault:k8s-ds/data/file-storage-aws-credentials#aws-access-key-id"
  - name: AWS_SECRET_ACCESS_KEY
    value: "vault:k8s-ds/data/file-storage-aws-credentials#aws-secret-access-key"

helm:
  helm_logs_job_enabled: false

csi:
  vault_namespace: 'k8s-ds'
  roleName: 'k8s-ds'
  vaultKubernetesMountPath: 'kubernetes-ds'

service_account:
  serviceAccountName: 'deps-ds'
